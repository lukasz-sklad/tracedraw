name: fork-flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Optional version override, e.g. 0.46.0"
        required: false
        default: ""

concurrency:
  group: fork-flatpak-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release != '') && format('v{0}', inputs.release) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  linux:
    if: github.repository_owner != 'tracedraw'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-flatpak-x86_64
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            echo "version=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - name: Build release binaries
        run: cargo build --release --locked -p tracedraw -p tracedraw-cli
      - name: Package tarball
        run: |
          mkdir -p dist
          strip target/release/tracedraw target/release/tracedraw-cli || true
          tar -C target/release -czf "dist/tracedraw-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" tracedraw tracedraw-cli
      - uses: actions/upload-artifact@v4
        with:
          name: tracedraw-fork-linux-tarball
          path: dist/tracedraw-*-linux-x86_64.tar.gz
          if-no-files-found: error

  flatpak:
    if: github.repository_owner != 'tracedraw'
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tracedraw-fork-linux-tarball
          path: linux
      - name: Prepare Flatpak manifest
        shell: bash
        run: |
          tgz=$(ls linux/tracedraw-*-linux-x86_64.tar.gz | head -n 1)
          cp "$tgz" packaging/linux/flatpak/tracedraw-linux-x86_64.tar.gz
          bash packaging/linux/flatpak/manifest.sh local "${{ needs.linux.outputs.version }}" > packaging/linux/flatpak/io.github.tracedraw.TraceDraw.yml
          cat packaging/linux/flatpak/io.github.tracedraw.TraceDraw.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/linux/flatpak/io.github.tracedraw.TraceDraw.yml
          bundle: tracedraw-${{ needs.linux.outputs.version }}-linux-x86_64.flatpak
          upload-artifact: false
          cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: tracedraw-flatpak
          path: tracedraw-${{ needs.linux.outputs.version }}-linux-x86_64.flatpak
          if-no-files-found: error
      - name: Publish Flatpak to fork release
        uses: softprops/action-gh-release@v2
        with:
          files: tracedraw-${{ needs.linux.outputs.version }}-linux-x86_64.flatpak
          tag_name: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || 'flatpak-nightly' }}
          name: ${{ env.RELEASE_TAG != '' && format('TraceDraw {0} (Flatpak)', needs.linux.outputs.version) || 'TraceDraw Flatpak Nightly' }}
          prerelease: ${{ env.RELEASE_TAG == '' }}
          make_latest: ${{ env.RELEASE_TAG != '' && 'true' || 'false' }}
